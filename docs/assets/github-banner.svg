<title id="title">MCP Maintainer Tools — Evidence, within reach.</title>
<desc id="desc">Seven read-only tools for source-aware vulnerability and package research. The evidence frame holds source, context and limits. Providers: OSV, NVD, CISA KEV, FIRST EPSS and deps.dev.</desc>
